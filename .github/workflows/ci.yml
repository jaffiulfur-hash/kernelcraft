name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 grub-pc-bin grub-common xorriso mtools

      - name: Build
        run: make

      - name: Self-tests (headless QEMU)
        run: make test
